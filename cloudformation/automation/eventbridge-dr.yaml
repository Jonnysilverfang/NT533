AWSTemplateFormatVersion: '2010-09-09'
Description: DR custom event bus and rule that starts only the Step Functions orchestrator.

Parameters:
  ProjectName: {Type: String}
  PrimaryRegion: {Type: String, Default: ap-southeast-2}
  PrimaryAlarmName: {Type: String}
  StateMachineArn: {Type: String}
  NotificationTopicArn: {Type: String}

Resources:
  AutomationDeadLetterQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  DrEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub '${ProjectName}-dr-events'

  StartExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: events.amazonaws.com}, Action: sts:AssumeRole}]
      Policies:
        - PolicyName: StartDrWorkflow
          PolicyDocument:
            Version: '2012-10-17'
            Statement: [{Effect: Allow, Action: states:StartExecution, Resource: !Ref StateMachineArn}]

  AlarmRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-confirmed-alarm-trigger'
      EventBusName: !Ref DrEventBus
      State: ENABLED
      EventPattern:
        source: [aws.cloudwatch]
        detail-type: [CloudWatch Alarm State Change]
        region: [!Ref PrimaryRegion]
        detail:
          alarmName: [!Ref PrimaryAlarmName]
          state:
            value: [ALARM]
      Targets:
        - Id: DrOrchestrator
          Arn: !Ref StateMachineArn
          RoleArn: !GetAtt StartExecutionRole.Arn
          Input: '{"trigger":"alarm","simulate_failure":false,"test_mode":false,"skip_route53_switch":true}'
          RetryPolicy:
            MaximumEventAgeInSeconds: 86400
            MaximumRetryAttempts: 185
          DeadLetterConfig:
            Arn: !GetAtt AutomationDeadLetterQueue.Arn

  WorkflowFailureRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-dr-workflow-failures'
      EventBusName: default
      State: ENABLED
      EventPattern:
        source: [aws.states]
        detail-type: [Step Functions Execution Status Change]
        detail:
          stateMachineArn: [!Ref StateMachineArn]
          status: [FAILED, TIMED_OUT, ABORTED]
      Targets:
        - Id: NotifyWorkflowFailure
          Arn: !Ref NotificationTopicArn
          RetryPolicy:
            MaximumEventAgeInSeconds: 86400
            MaximumRetryAttempts: 185
          DeadLetterConfig:
            Arn: !GetAtt AutomationDeadLetterQueue.Arn

  AutomationDeadLetterQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref AutomationDeadLetterQueue]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: events.amazonaws.com}
            Action: sqs:SendMessage
            Resource: !GetAtt AutomationDeadLetterQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn:
                  - !GetAtt AlarmRule.Arn
                  - !GetAtt WorkflowFailureRule.Arn

Outputs:
  DrEventBusArn: {Description: Cross-Region target event bus ARN., Value: !GetAtt DrEventBus.Arn}
  DrEventBusName: {Description: DR event bus name., Value: !Ref DrEventBus}
  DeadLetterQueueUrl: {Description: Queue containing undeliverable DR automation events., Value: !Ref AutomationDeadLetterQueue}
