AWSTemplateFormatVersion: '2010-09-09'
Description: Standard Step Functions workflow for confirmed, on-demand DR recovery.

Parameters:
  ProjectName: {Type: String}
  StateMachineRoleArn: {Type: String}
  NotificationTopicArn: {Type: String}
  CheckPrimaryFunctionArn: {Type: String}
  FindRecoveryPointFunctionArn: {Type: String}
  StartRestoreFunctionArn: {Type: String}
  UpdateSecretFunctionArn: {Type: String}
  CheckAlbFunctionArn: {Type: String}
  ParseStackOutputsFunctionArn: {Type: String}
  ManageLockFunctionArn: {Type: String}
  CloudFormationExecutionRoleArn: {Type: String}
  BackupRestoreRoleArn: {Type: String}
  DrRuntimeTemplateUrl: {Type: String}
  DrRuntimeStackName: {Type: String, Default: prod-dr-runtime-production}
  PrimaryRegion: {Type: String, Default: ap-southeast-2}
  PrimaryAlarmName: {Type: String}
  DrBackupVaultName: {Type: String, Default: prod-dr-backup-vault}
  SourceCredentialSecretId: {Type: String}
  SourceDatabaseArn: {Type: String}
  DbInstanceIdentifier: {Type: String, Default: prod-dr-restored-db}
  DbInstanceClass: {Type: String, Default: db.t4g.micro}
  DatabaseName: {Type: String, Default: appdb}
  ContainerPort: {Type: Number, Default: 8080}
  HostedZoneId: {Type: String}
  DomainName: {Type: String}
  DrVpcCidr: {Type: String, Default: 10.20.0.0/16}
  DrPublicSubnet1Cidr: {Type: String, Default: 10.20.0.0/24}
  DrPublicSubnet2Cidr: {Type: String, Default: 10.20.1.0/24}
  DrPrivateAppSubnet1Cidr: {Type: String, Default: 10.20.10.0/24}
  DrPrivateAppSubnet2Cidr: {Type: String, Default: 10.20.11.0/24}
  DrPrivateDbSubnet1Cidr: {Type: String, Default: 10.20.20.0/24}
  DrPrivateDbSubnet2Cidr: {Type: String, Default: 10.20.21.0/24}
  DrCertificateArn: {Type: String, Default: ''}
  RepositoryPrefix: {Type: String, Default: prod}
  ImageTag: {Type: String, Default: v1}
  ProductionDesiredCount: {Type: Number, Default: 1}
  WorkflowTimeoutSeconds: {Type: Number, Default: 43200, MinValue: 3600, MaxValue: 86400}

Resources:
  WorkflowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/vendedlogs/states/${ProjectName}-dr-orchestrator'
      RetentionInDays: 90

  StateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub '${ProjectName}-orchestrator'
      StateMachineType: STANDARD
      RoleArn: !Ref StateMachineRoleArn
      LoggingConfiguration:
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt WorkflowLogGroup.Arn
        IncludeExecutionData: true
        Level: ALL
      TracingConfiguration:
        Enabled: true
      DefinitionString:
        Fn::Sub: |
          {
            "Comment": "Low-cost backup-and-restore DR orchestration",
            "TimeoutSeconds": ${WorkflowTimeoutSeconds},
            "StartAt": "ValidateTrigger",
            "States": {
              "ValidateTrigger": {
                "Type": "Choice",
                "Choices": [
                  {"Variable": "$.trigger", "StringEquals": "alarm", "Next": "AcquireDrLock"},
                  {"Variable": "$.trigger", "StringEquals": "manual-test", "Next": "AcquireDrLock"}
                ],
                "Default": "InvalidTrigger"
              },
              "InvalidTrigger": {"Type": "Fail", "Error": "InvalidTrigger", "Cause": "Use EventBridge or the test script."},
              "AcquireDrLock": {
                "Type":"Task","Resource":"arn:${AWS::Partition}:states:::lambda:invoke",
                "Parameters":{"FunctionName":"${ManageLockFunctionArn}","Payload":{"action":"acquire","owner.$":"$$.Execution.Id","ttl_seconds":${WorkflowTimeoutSeconds}}},
                "ResultSelector":{"lock.$":"$.Payload"},"ResultPath":"$.dr_lock",
                "Retry":[{"ErrorEquals":["Lambda.ServiceException","Lambda.TooManyRequestsException"],"IntervalSeconds":2,"MaxAttempts":4,"BackoffRate":2}],
                "Catch":[{"ErrorEquals":["States.ALL"],"Next":"LockUnavailableFailure"}],
                "Next":"LockAcquired"
              },
              "LockAcquired": {
                "Type":"Choice","Choices":[{"Variable":"$.dr_lock.lock.acquired","BooleanEquals":true,"Next":"NotifyFailureDetected"}],
                "Default":"NotifyAlreadyRunning"
              },
              "NotifyAlreadyRunning": {
                "Type":"Task","Resource":"arn:${AWS::Partition}:states:::sns:publish",
                "Parameters":{"TopicArn":"${NotificationTopicArn}","Subject":"DR execution suppressed","Message.$":"States.Format('Another DR execution already owns the singleton lock: {}', $.dr_lock.lock.owner)"},
                "Catch":[{"ErrorEquals":["States.ALL"],"Next":"AlreadyRunning"}],
                "Next":"AlreadyRunning"
              },
              "AlreadyRunning":{"Type":"Succeed"},
              "LockUnavailableFailure":{"Type":"Fail","Error":"DrLockUnavailable","Cause":"Could not acquire the DR singleton lock."},
              "NotifyFailureDetected": {
                "Type": "Task", "Resource": "arn:${AWS::Partition}:states:::sns:publish",
                "Parameters": {"TopicArn": "${NotificationTopicArn}", "Subject": "Primary failure detected", "Message": "Primary alarm triggered; DR confirmation window started."},
                "Retry": [{"ErrorEquals": ["States.ALL"], "IntervalSeconds": 2, "MaxAttempts": 3, "BackoffRate": 2}],
                "Catch": [{"ErrorEquals": ["States.ALL"], "ResultPath": "$.notification_error", "Next": "ConfirmationWindow"}],
                "Next": "ConfirmationWindow"
              },
              "ConfirmationWindow": {"Type": "Wait", "Seconds": 90, "Next": "RecheckPrimary"},
              "RecheckPrimary": {
                "Type": "Task", "Resource": "arn:${AWS::Partition}:states:::lambda:invoke",
                "Parameters": {"FunctionName": "${CheckPrimaryFunctionArn}", "Payload": {"simulate_failure.$": "$.simulate_failure", "primary_region": "${PrimaryRegion}", "alarm_name": "${PrimaryAlarmName}"}},
                "ResultSelector": {"still_failed.$": "$.Payload.still_failed", "alarm_state.$": "$.Payload.alarm_state"},
                "ResultPath": "$.confirmation",
                "Retry": [{"ErrorEquals": ["Lambda.ServiceException", "Lambda.TooManyRequestsException"], "IntervalSeconds": 2, "MaxAttempts": 4, "BackoffRate": 2}],
                "Catch": [{"ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "NotifyFailure"}],
                "Next": "FailureConfirmed"
              },
              "FailureConfirmed": {
                "Type": "Choice",
                "Choices": [{"Variable": "$.confirmation.still_failed", "BooleanEquals": true, "Next": "NotifyWorkflowStarted"}],
                "Default": "NotifyPrimaryRecovered"
              },
              "NotifyPrimaryRecovered": {
                "Type": "Task", "Resource": "arn:${AWS::Partition}:states:::sns:publish",
                "Parameters": {"TopicArn": "${NotificationTopicArn}", "Subject": "DR cancelled", "Message": "Primary recovered during the 90-second confirmation window; no DR resources were created."},
                "Catch": [{"ErrorEquals":["States.ALL"],"ResultPath":"$.notification_error","Next":"ReleaseLockRecovered"}],
                "Next": "ReleaseLockRecovered"
              },
              "RecoveredWithoutDr": {"Type": "Succeed"},
              "NotifyWorkflowStarted": {
                "Type": "Task", "Resource": "arn:${AWS::Partition}:states:::sns:publish",
                "Parameters": {"TopicArn": "${NotificationTopicArn}", "Subject": "DR workflow started", "Message": "Primary failure confirmed. DR orchestration is proceeding."},
                "Catch": [{"ErrorEquals":["States.ALL"],"ResultPath":"$.notification_error","Next":"NotifyStackCreationStarted"}],
                "Next": "NotifyStackCreationStarted"
              },
              "NotifyStackCreationStarted": {
                "Type": "Task", "Resource": "arn:${AWS::Partition}:states:::sns:publish",
                "Parameters": {"TopicArn": "${NotificationTopicArn}", "Subject": "DR stack creation started", "Message": "Creating the on-demand Singapore network, ALB and zero-count ECS services."},
                "Catch": [{"ErrorEquals":["States.ALL"],"ResultPath":"$.notification_error","Next":"CreateDrStack"}],
                "Next": "CreateDrStack"
              },
              "CreateDrStack": {
                "Type": "Task", "Resource": "arn:${AWS::Partition}:states:::aws-sdk:cloudformation:createStack",
                "Parameters": {
                  "StackName": "${DrRuntimeStackName}", "TemplateURL": "${DrRuntimeTemplateUrl}",
                  "RoleARN": "${CloudFormationExecutionRoleArn}", "Capabilities": ["CAPABILITY_IAM"],
                  "OnFailure": "ROLLBACK", "EnableTerminationProtection": false,
                  "Parameters": [
                    {"ParameterKey":"ProjectName","ParameterValue":"${ProjectName}"},
                    {"ParameterKey":"VpcCidr","ParameterValue":"${DrVpcCidr}"},
                    {"ParameterKey":"PublicSubnet1Cidr","ParameterValue":"${DrPublicSubnet1Cidr}"},
                    {"ParameterKey":"PublicSubnet2Cidr","ParameterValue":"${DrPublicSubnet2Cidr}"},
                    {"ParameterKey":"PrivateAppSubnet1Cidr","ParameterValue":"${DrPrivateAppSubnet1Cidr}"},
                    {"ParameterKey":"PrivateAppSubnet2Cidr","ParameterValue":"${DrPrivateAppSubnet2Cidr}"},
                    {"ParameterKey":"PrivateDbSubnet1Cidr","ParameterValue":"${DrPrivateDbSubnet1Cidr}"},
                    {"ParameterKey":"PrivateDbSubnet2Cidr","ParameterValue":"${DrPrivateDbSubnet2Cidr}"},
                    {"ParameterKey":"CertificateArn","ParameterValue":"${DrCertificateArn}"},
                    {"ParameterKey":"RepositoryPrefix","ParameterValue":"${RepositoryPrefix}"},
                    {"ParameterKey":"ImageTag","ParameterValue":"${ImageTag}"},
                    {"ParameterKey":"DatabaseName","ParameterValue":"${DatabaseName}"},
                    {"ParameterKey":"ContainerPort","ParameterValue":"${ContainerPort}"},
                    {"ParameterKey":"ProductionDesiredCount","ParameterValue":"${ProductionDesiredCount}"}
                  ],
                  "Tags": [{"Key":"Environment","Value":"production"},{"Key":"Project","Value":"multi-region-dr"},{"Key":"ManagedBy","Value":"step-functions"}]
                },
                "ResultPath": "$.stack_create",
                "Retry": [{"ErrorEquals": ["CloudFormation.ThrottlingException"], "IntervalSeconds": 5, "MaxAttempts": 5, "BackoffRate": 2}],
                "Catch": [
                  {"ErrorEquals": ["CloudFormation.AlreadyExistsException"], "ResultPath": "$.stack_exists", "Next": "WaitBeforeDescribeStack"},
                  {"ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "NotifyFailure"}
                ],
                "Next": "WaitBeforeDescribeStack"
              },
              "WaitBeforeDescribeStack": {"Type": "Wait", "Seconds": 30, "Next": "DescribeDrStack"},
              "DescribeDrStack": {
                "Type": "Task", "Resource": "arn:${AWS::Partition}:states:::aws-sdk:cloudformation:describeStacks",
                "Parameters": {"StackName": "${DrRuntimeStackName}"}, "ResultPath": "$.stack",
                "Retry": [{"ErrorEquals": ["CloudFormation.ThrottlingException"], "IntervalSeconds": 5, "MaxAttempts": 5, "BackoffRate": 2}],
                "Catch": [{"ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "NotifyFailure"}],
                "Next": "StackStatus"
              },
              "StackStatus": {
                "Type": "Choice",
                "Choices": [
                  {"Variable": "$.stack.Stacks[0].StackStatus", "StringEquals": "CREATE_COMPLETE", "Next": "ParseStackOutputs"},
                  {"Variable": "$.stack.Stacks[0].StackStatus", "StringMatches": "*_FAILED", "Next": "StackFailed"},
                  {"Variable": "$.stack.Stacks[0].StackStatus", "StringMatches": "ROLLBACK_*", "Next": "StackFailed"}
                ],
                "Default": "WaitBeforeDescribeStack"
              },
              "StackFailed": {"Type":"Pass","Result":{"Cause":"DR CloudFormation stack failed"},"ResultPath":"$.error","Next":"NotifyFailure"},
              "ParseStackOutputs": {
                "Type": "Task", "Resource": "arn:${AWS::Partition}:states:::lambda:invoke",
                "Parameters": {"FunctionName": "${ParseStackOutputsFunctionArn}", "Payload": {"outputs.$": "$.stack.Stacks[0].Outputs"}},
                "ResultSelector": {"outputs.$": "$.Payload"}, "ResultPath": "$.dr",
                "Catch": [{"ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "NotifyFailure"}],
                "Next": "NotifyStackCreated"
              },
              "NotifyStackCreated": {
                "Type": "Task", "Resource": "arn:${AWS::Partition}:states:::sns:publish",
                "Parameters": {"TopicArn": "${NotificationTopicArn}", "Subject": "DR stack created", "Message": "VPC, ALB and zero-count ECS services are ready. Starting RDS restore."},
                "Catch": [{"ErrorEquals":["States.ALL"],"ResultPath":"$.notification_error","Next":"FindLatestRecoveryPoint"}],
                "Next": "FindLatestRecoveryPoint"
              },
              "FindLatestRecoveryPoint": {
                "Type": "Task", "Resource": "arn:${AWS::Partition}:states:::lambda:invoke",
                "Parameters": {"FunctionName": "${FindRecoveryPointFunctionArn}", "Payload": {"backup_vault_name": "${DrBackupVaultName}", "source_resource_arn": "${SourceDatabaseArn}"}},
                "ResultSelector": {"point.$": "$.Payload"}, "ResultPath": "$.recovery",
                "Retry": [{"ErrorEquals": ["Lambda.ServiceException", "Lambda.TooManyRequestsException"], "IntervalSeconds": 5, "MaxAttempts": 4, "BackoffRate": 2}],
                "Catch": [{"ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "NotifyFailure"}],
                "Next": "StartRdsRestore"
              },
              "StartRdsRestore": {
                "Type": "Task", "Resource": "arn:${AWS::Partition}:states:::lambda:invoke",
                "Parameters": {"FunctionName": "${StartRestoreFunctionArn}", "Payload": {
                  "recovery_point_arn.$": "$.recovery.point.recovery_point_arn", "backup_vault_name": "${DrBackupVaultName}",
                  "restore_role_arn": "${BackupRestoreRoleArn}", "db_instance_identifier": "${DbInstanceIdentifier}",
                  "db_instance_class": "${DbInstanceClass}", "db_subnet_group_name.$": "$.dr.outputs.DbSubnetGroupName",
                  "db_security_group_id.$": "$.dr.outputs.DbSecurityGroupId", "test_mode.$": "$.test_mode"
                }},
                "ResultSelector": {"job.$": "$.Payload"}, "ResultPath": "$.restore",
                "Retry": [{"ErrorEquals": ["Lambda.ServiceException", "Lambda.TooManyRequestsException"], "IntervalSeconds": 5, "MaxAttempts": 3, "BackoffRate": 2}],
                "Catch": [{"ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "NotifyFailure"}],
                "Next": "NotifyRestoreStarted"
              },
              "NotifyRestoreStarted": {
                "Type": "Task", "Resource": "arn:${AWS::Partition}:states:::sns:publish",
                "Parameters": {"TopicArn": "${NotificationTopicArn}", "Subject": "RDS restore started", "Message.$": "States.Format('Restore job {} started from {}', $.restore.job.restore_job_id, $.recovery.point.creation_date)"},
                "Catch": [{"ErrorEquals":["States.ALL"],"ResultPath":"$.notification_error","Next":"WaitForRestore"}],
                "Next": "WaitForRestore"
              },
              "WaitForRestore": {"Type": "Wait", "Seconds": 60, "Next": "DescribeRestoreJob"},
              "DescribeRestoreJob": {
                "Type": "Task", "Resource": "arn:${AWS::Partition}:states:::aws-sdk:backup:describeRestoreJob",
                "Parameters": {"RestoreJobId.$": "$.restore.job.restore_job_id"}, "ResultPath": "$.restore_status",
                "Retry": [{"ErrorEquals": ["Backup.ThrottlingException", "Backup.ServiceUnavailableException"], "IntervalSeconds": 10, "MaxAttempts": 5, "BackoffRate": 2}],
                "Catch": [{"ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "NotifyFailure"}],
                "Next": "RestoreStatus"
              },
              "RestoreStatus": {
                "Type": "Choice",
                "Choices": [
                  {"Variable": "$.restore_status.Status", "StringEquals": "COMPLETED", "Next": "DescribeRestoredDatabase"},
                  {"Variable": "$.restore_status.Status", "StringEquals": "FAILED", "Next": "RestoreFailed"},
                  {"Variable": "$.restore_status.Status", "StringEquals": "ABORTED", "Next": "RestoreFailed"}
                ],
                "Default": "WaitForRestore"
              },
              "RestoreFailed": {"Type":"Pass","Result":{"Cause":"AWS Backup restore job failed"},"ResultPath":"$.error","Next":"NotifyFailure"},
              "DescribeRestoredDatabase": {
                "Type": "Task", "Resource": "arn:${AWS::Partition}:states:::aws-sdk:rds:describeDBInstances",
                "Parameters": {"DBInstanceIdentifier": "${DbInstanceIdentifier}"}, "ResultPath": "$.database",
                "Retry": [{"ErrorEquals": ["Rds.DBInstanceNotFoundException", "Rds.ThrottlingException"], "IntervalSeconds": 20, "MaxAttempts": 6, "BackoffRate": 1.5}],
                "Catch": [{"ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "NotifyFailure"}],
                "Next": "DatabaseStatus"
              },
              "DatabaseStatus": {
                "Type":"Choice",
                "Choices":[{"Variable":"$.database.DBInstances[0].DBInstanceStatus","StringEquals":"available","Next":"NotifyRdsRestored"}],
                "Default":"WaitForDatabase"
              },
              "WaitForDatabase": {"Type":"Wait","Seconds":30,"Next":"DescribeRestoredDatabase"},
              "NotifyRdsRestored": {
                "Type":"Task","Resource":"arn:${AWS::Partition}:states:::sns:publish",
                "Parameters":{"TopicArn":"${NotificationTopicArn}","Subject":"RDS restored","Message":"AWS Backup restore completed and the Singapore RDS instance is available."},
                "Catch":[{"ErrorEquals":["States.ALL"],"ResultPath":"$.notification_error","Next":"UpdateRuntimeSecret"}],
                "Next":"UpdateRuntimeSecret"
              },
              "UpdateRuntimeSecret": {
                "Type": "Task", "Resource": "arn:${AWS::Partition}:states:::lambda:invoke",
                "Parameters": {"FunctionName": "${UpdateSecretFunctionArn}", "Payload": {
                  "db_instance_identifier": "${DbInstanceIdentifier}", "source_secret_id": "${SourceCredentialSecretId}",
                  "runtime_secret_arn.$": "$.dr.outputs.RuntimeSecretArn", "database_name": "${DatabaseName}"
                }},
                "ResultPath": "$.secret_update",
                "Catch": [{"ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "NotifyFailure"}],
                "Next": "StartEcsServices"
              },
              "StartEcsServices": {
                "Type": "Parallel", "ResultPath": "$.ecs_updates",
                "Branches": [
                  {"StartAt":"StartAuth","States":{"StartAuth":{"Type":"Task","Resource":"arn:${AWS::Partition}:states:::aws-sdk:ecs:updateService","Parameters":{"Cluster.$":"$.dr.outputs.EcsClusterName","Service.$":"$.dr.outputs.AuthServiceName","DesiredCount":${ProductionDesiredCount},"ForceNewDeployment":true},"End":true}}},
                  {"StartAt":"StartProduct","States":{"StartProduct":{"Type":"Task","Resource":"arn:${AWS::Partition}:states:::aws-sdk:ecs:updateService","Parameters":{"Cluster.$":"$.dr.outputs.EcsClusterName","Service.$":"$.dr.outputs.ProductServiceName","DesiredCount":${ProductionDesiredCount},"ForceNewDeployment":true},"End":true}}},
                  {"StartAt":"StartOrder","States":{"StartOrder":{"Type":"Task","Resource":"arn:${AWS::Partition}:states:::aws-sdk:ecs:updateService","Parameters":{"Cluster.$":"$.dr.outputs.EcsClusterName","Service.$":"$.dr.outputs.OrderServiceName","DesiredCount":${ProductionDesiredCount},"ForceNewDeployment":true},"End":true}}}
                ],
                "Retry": [{"ErrorEquals": ["Ecs.ServerException", "Ecs.ThrottlingException"], "IntervalSeconds": 5, "MaxAttempts": 4, "BackoffRate": 2}],
                "Catch": [{"ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "NotifyFailure"}],
                "Next": "NotifyEcsStarted"
              },
              "NotifyEcsStarted": {
                "Type":"Task","Resource":"arn:${AWS::Partition}:states:::sns:publish",
                "Parameters":{"TopicArn":"${NotificationTopicArn}","Subject":"ECS started","Message":"All three Singapore ECS services were scaled from zero; waiting for ALB target health."},
                "Catch":[{"ErrorEquals":["States.ALL"],"ResultPath":"$.notification_error","Next":"InitializeAlbAttempts"}],
                "Next":"InitializeAlbAttempts"
              },
              "InitializeAlbAttempts": {"Type":"Pass","Parameters":{"count":0},"ResultPath":"$.alb_attempt","Next":"WaitForAlb"},
              "WaitForAlb": {"Type":"Wait","Seconds":30,"Next":"CheckAlbHealth"},
              "CheckAlbHealth": {
                "Type": "Task", "Resource": "arn:${AWS::Partition}:states:::lambda:invoke",
                "Parameters": {"FunctionName": "${CheckAlbFunctionArn}", "Payload": {"target_group_arns.$": "States.Array($.dr.outputs.AuthTargetGroupArn, $.dr.outputs.ProductTargetGroupArn, $.dr.outputs.OrderTargetGroupArn)", "expected_healthy_per_group": 1}},
                "ResultSelector": {"health.$": "$.Payload"}, "ResultPath": "$.alb",
                "Catch": [{"ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "NotifyFailure"}],
                "Next": "AlbHealthy"
              },
              "AlbHealthy": {
                "Type":"Choice",
                "Choices":[{"Variable":"$.alb.health.all_healthy","BooleanEquals":true,"Next":"NotifyAlbHealthy"},{"Variable":"$.alb_attempt.count","NumericGreaterThanEquals":30,"Next":"AlbTimedOut"}],
                "Default":"IncrementAlbAttempts"
              },
              "IncrementAlbAttempts": {"Type":"Pass","Parameters":{"count.$":"States.MathAdd($.alb_attempt.count, 1)"},"ResultPath":"$.alb_attempt","Next":"WaitForAlb"},
              "AlbTimedOut": {"Type":"Pass","Result":{"Cause":"ALB targets did not become healthy within 15 minutes"},"ResultPath":"$.error","Next":"NotifyFailure"},
              "NotifyAlbHealthy": {
                "Type":"Task","Resource":"arn:${AWS::Partition}:states:::sns:publish",
                "Parameters":{"TopicArn":"${NotificationTopicArn}","Subject":"DR ALB healthy","Message":"Restored database and all three DR target groups are healthy."},
                "Catch":[{"ErrorEquals":["States.ALL"],"ResultPath":"$.notification_error","Next":"RecheckBeforeCutover"}],
                "Next":"RecheckBeforeCutover"
              },
              "RecheckBeforeCutover": {
                "Type": "Task", "Resource": "arn:${AWS::Partition}:states:::lambda:invoke",
                "Parameters": {"FunctionName": "${CheckPrimaryFunctionArn}", "Payload": {"simulate_failure.$": "$.simulate_failure", "primary_region": "${PrimaryRegion}", "alarm_name": "${PrimaryAlarmName}"}},
                "ResultSelector": {"still_failed.$": "$.Payload.still_failed", "alarm_state.$": "$.Payload.alarm_state"},
                "ResultPath": "$.pre_cutover_confirmation",
                "Retry": [{"ErrorEquals": ["Lambda.ServiceException", "Lambda.TooManyRequestsException"], "IntervalSeconds": 2, "MaxAttempts": 4, "BackoffRate": 2}],
                "Catch": [{"ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "NotifyFailure"}],
                "Next": "PrimaryStillFailedBeforeCutover"
              },
              "PrimaryStillFailedBeforeCutover": {
                "Type": "Choice",
                "Choices": [{"Variable": "$.pre_cutover_confirmation.still_failed", "BooleanEquals": true, "Next": "SkipDnsRequested"}],
                "Default": "NotifyRecoveredBeforeCutover"
              },
              "NotifyRecoveredBeforeCutover": {
                "Type": "Task", "Resource": "arn:${AWS::Partition}:states:::sns:publish",
                "Parameters": {"TopicArn": "${NotificationTopicArn}", "Subject": "Primary recovered before cutover", "Message": "DR runtime is healthy but DNS was not changed because the primary alarm recovered. Operator review is required."},
                "Catch": [{"ErrorEquals":["States.ALL"],"ResultPath":"$.notification_error","Next":"ReleaseLockRecovered"}],
                "Next": "ReleaseLockRecovered"
              },
              "SkipDnsRequested": {
                "Type":"Choice",
                "Choices":[{"Variable":"$.skip_route53_switch","BooleanEquals":true,"Next":"NotifyTestComplete"}],
                "Default":"UpsertSecondaryRecord"
              },
              "UpsertSecondaryRecord": {
                "Type":"Task","Resource":"arn:${AWS::Partition}:states:::aws-sdk:route53:changeResourceRecordSets",
                "Parameters":{"HostedZoneId":"${HostedZoneId}","ChangeBatch":{"Comment":"Confirmed DR cutover","Changes":[{"Action":"UPSERT","ResourceRecordSet":{"Name":"${DomainName}","Type":"A","SetIdentifier":"secondary-singapore","Failover":"SECONDARY","AliasTarget":{"DNSName.$":"$.dr.outputs.LoadBalancerDnsName","HostedZoneId.$":"$.dr.outputs.LoadBalancerCanonicalHostedZoneId","EvaluateTargetHealth":true}}}]}},
                "Retry":[{"ErrorEquals":["Route53.PriorRequestNotCompleteException","Route53.ThrottlingException"],"IntervalSeconds":5,"MaxAttempts":6,"BackoffRate":2}],
                "Catch":[{"ErrorEquals":["States.ALL"],"ResultPath":"$.error","Next":"NotifyFailure"}],
                "Next":"NotifyRoute53Switched"
              },
              "NotifyTestComplete": {
                "Type":"Task","Resource":"arn:${AWS::Partition}:states:::sns:publish",
                "Parameters":{"TopicArn":"${NotificationTopicArn}","Subject":"DR test ready","Message":"DR stack, database and ECS are healthy. Route 53 switch was intentionally skipped."},
                "Catch":[{"ErrorEquals":["States.ALL"],"ResultPath":"$.notification_error","Next":"ReleaseLockSuccess"}],
                "Next":"ReleaseLockSuccess"
              },
              "NotifyDrSuccess": {
                "Type":"Task","Resource":"arn:${AWS::Partition}:states:::sns:publish",
                "Parameters":{"TopicArn":"${NotificationTopicArn}","Subject":"DR success","Message":"Secondary Route 53 record created after database, ECS and ALB validation. Traffic can fail over to Singapore."},
                "Catch":[{"ErrorEquals":["States.ALL"],"ResultPath":"$.notification_error","Next":"ReleaseLockSuccess"}],
                "Next":"ReleaseLockSuccess"
              },
              "NotifyRoute53Switched": {
                "Type":"Task","Resource":"arn:${AWS::Partition}:states:::sns:publish",
                "Parameters":{"TopicArn":"${NotificationTopicArn}","Subject":"Route 53 switched","Message":"The Singapore SECONDARY failover alias was created after all health gates passed."},
                "Catch":[{"ErrorEquals":["States.ALL"],"ResultPath":"$.notification_error","Next":"NotifyDrSuccess"}],
                "Next":"NotifyDrSuccess"
              },
              "ReleaseLockRecovered": {
                "Type":"Task","Resource":"arn:${AWS::Partition}:states:::lambda:invoke",
                "Parameters":{"FunctionName":"${ManageLockFunctionArn}","Payload":{"action":"release","owner.$":"$$.Execution.Id"}},
                "ResultPath":"$.lock_release","Retry":[{"ErrorEquals":["Lambda.ServiceException","Lambda.TooManyRequestsException"],"IntervalSeconds":2,"MaxAttempts":3,"BackoffRate":2}],
                "Catch":[{"ErrorEquals":["States.ALL"],"Next":"RecoveredWithoutDr"}],"Next":"RecoveredWithoutDr"
              },
              "ReleaseLockSuccess": {
                "Type":"Task","Resource":"arn:${AWS::Partition}:states:::lambda:invoke",
                "Parameters":{"FunctionName":"${ManageLockFunctionArn}","Payload":{"action":"release","owner.$":"$$.Execution.Id"}},
                "ResultPath":"$.lock_release","Retry":[{"ErrorEquals":["Lambda.ServiceException","Lambda.TooManyRequestsException"],"IntervalSeconds":2,"MaxAttempts":3,"BackoffRate":2}],
                "Catch":[{"ErrorEquals":["States.ALL"],"Next":"DrSucceeded"}],"Next":"DrSucceeded"
              },
              "DrSucceeded": {"Type":"Succeed"},
              "NotifyFailure": {
                "Type":"Task","Resource":"arn:${AWS::Partition}:states:::sns:publish",
                "Parameters":{"TopicArn":"${NotificationTopicArn}","Subject":"DR failed","Message.$":"States.Format('DR workflow failed: {}', $.error.Cause)"},
                "Catch":[{"ErrorEquals":["States.ALL"],"ResultPath":"$.notification_error","Next":"ReleaseLockFailure"}],
                "Next":"ReleaseLockFailure"
              },
              "ReleaseLockFailure": {
                "Type":"Task","Resource":"arn:${AWS::Partition}:states:::lambda:invoke",
                "Parameters":{"FunctionName":"${ManageLockFunctionArn}","Payload":{"action":"release","owner.$":"$$.Execution.Id"}},
                "ResultPath":"$.lock_release","Retry":[{"ErrorEquals":["Lambda.ServiceException","Lambda.TooManyRequestsException"],"IntervalSeconds":2,"MaxAttempts":3,"BackoffRate":2}],
                "Catch":[{"ErrorEquals":["States.ALL"],"Next":"DrFailed"}],"Next":"DrFailed"
              },
              "DrFailed": {"Type":"Fail","Error":"DrWorkflowFailed","Cause":"Inspect Step Functions history and CloudFormation events."}
            }
          }

Outputs:
  StateMachineArn: {Description: DR orchestrator state machine ARN., Value: !Ref StateMachine}
  StateMachineName: {Description: DR orchestrator name., Value: !GetAtt StateMachine.Name}
