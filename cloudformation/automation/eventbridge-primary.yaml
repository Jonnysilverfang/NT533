AWSTemplateFormatVersion: '2010-09-09'
Description: Sydney rule forwarding one exact CloudWatch alarm event to the Singapore event bus.

Parameters:
  ProjectName: {Type: String}
  PrimaryAlarmName: {Type: String}
  DrEventBusArn: {Type: String}

Resources:
  ForwardingDeadLetterQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  ForwardRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: events.amazonaws.com}, Action: sts:AssumeRole}]
      Policies:
        - PolicyName: PutOnlyToDrBus
          PolicyDocument:
            Version: '2012-10-17'
            Statement: [{Effect: Allow, Action: events:PutEvents, Resource: !Ref DrEventBusArn}]

  PrimaryAlarmForwarder:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-forward-primary-alarm-to-dr'
      State: ENABLED
      EventPattern:
        source: [aws.cloudwatch]
        detail-type: [CloudWatch Alarm State Change]
        detail:
          alarmName: [!Ref PrimaryAlarmName]
          state:
            value: [ALARM]
      Targets:
        - Id: DrRegionEventBus
          Arn: !Ref DrEventBusArn
          RoleArn: !GetAtt ForwardRole.Arn
          DeadLetterConfig:
            Arn: !GetAtt ForwardingDeadLetterQueue.Arn

  ForwardingDeadLetterQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref ForwardingDeadLetterQueue]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: events.amazonaws.com}
            Action: sqs:SendMessage
            Resource: !GetAtt ForwardingDeadLetterQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt PrimaryAlarmForwarder.Arn

Outputs:
  RuleArn: {Description: Primary cross-Region forwarding rule ARN., Value: !GetAtt PrimaryAlarmForwarder.Arn}
  DeadLetterQueueUrl: {Description: Queue containing undeliverable cross-Region alarm events., Value: !Ref ForwardingDeadLetterQueue}
