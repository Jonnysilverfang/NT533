AWSTemplateFormatVersion: '2010-09-09'
Description: Singapore DR automation baseline using nested stacks.

Parameters:
  ProjectName: {Type: String, Default: prod-dr}
  PrimaryRegion: {Type: String, Default: ap-southeast-2}
  PrimaryAlarmName: {Type: String}
  NotificationEmail: {Type: String, Default: ''}
  DrBackupVaultArn: {Type: String}
  DrBackupKmsKeyArn: {Type: String}
  DrBackupVaultName: {Type: String, Default: prod-dr-backup-vault}
  ArtifactBucketArn: {Type: String}
  DrRuntimeTemplateUrl: {Type: String}
  SourceCredentialSecretName: {Type: String}
  SourceDatabaseArn: {Type: String}
  HostedZoneId: {Type: String}
  DomainName: {Type: String}
  DbInstanceClass: {Type: String, Default: db.t4g.micro}
  DatabaseName: {Type: String, Default: appdb}
  ContainerPort: {Type: Number, Default: 8080}
  DrCertificateArn: {Type: String, Default: ''}
  RepositoryPrefix: {Type: String, Default: prod}
  ImageTag: {Type: String, Default: v1}
  ProductionDesiredCount: {Type: Number, Default: 1}
  WorkflowTimeoutSeconds: {Type: Number, Default: 43200, MinValue: 3600, MaxValue: 86400}

Resources:
  SnsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./sns.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        NotificationEmail: !Ref NotificationEmail

  LockStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./lock.yaml

  IamStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./iam.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        DrBackupVaultArn: !Ref DrBackupVaultArn
        NotificationTopicArn: !GetAtt SnsStack.Outputs.TopicArn
        NotificationKeyArn: !GetAtt SnsStack.Outputs.TopicKeyArn
        ArtifactBucketArn: !Ref ArtifactBucketArn
        SourceCredentialSecretName: !Ref SourceCredentialSecretName
        HostedZoneId: !Ref HostedZoneId
        LockTableArn: !GetAtt LockStack.Outputs.TableArn
        DrBackupKmsKeyArn: !Ref DrBackupKmsKeyArn

  LambdaStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./lambda.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        CheckPrimaryRoleArn: !GetAtt IamStack.Outputs.CheckPrimaryRoleArn
        FindRecoveryPointRoleArn: !GetAtt IamStack.Outputs.FindRecoveryPointRoleArn
        StartRestoreRoleArn: !GetAtt IamStack.Outputs.StartRestoreRoleArn
        UpdateSecretRoleArn: !GetAtt IamStack.Outputs.UpdateSecretRoleArn
        CheckAlbRoleArn: !GetAtt IamStack.Outputs.CheckAlbRoleArn
        ParseStackOutputsRoleArn: !GetAtt IamStack.Outputs.ParseStackOutputsRoleArn
        ManageLockRoleArn: !GetAtt IamStack.Outputs.ManageLockRoleArn
        LockTableName: !GetAtt LockStack.Outputs.TableName

  StepFunctionsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./stepfunctions.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        StateMachineRoleArn: !GetAtt IamStack.Outputs.OrchestratorRoleArn
        NotificationTopicArn: !GetAtt SnsStack.Outputs.TopicArn
        CheckPrimaryFunctionArn: !GetAtt LambdaStack.Outputs.CheckPrimaryFunctionArn
        FindRecoveryPointFunctionArn: !GetAtt LambdaStack.Outputs.FindRecoveryPointFunctionArn
        StartRestoreFunctionArn: !GetAtt LambdaStack.Outputs.StartRestoreFunctionArn
        UpdateSecretFunctionArn: !GetAtt LambdaStack.Outputs.UpdateSecretFunctionArn
        CheckAlbFunctionArn: !GetAtt LambdaStack.Outputs.CheckAlbFunctionArn
        ParseStackOutputsFunctionArn: !GetAtt LambdaStack.Outputs.ParseStackOutputsFunctionArn
        ManageLockFunctionArn: !GetAtt LambdaStack.Outputs.ManageLockFunctionArn
        CloudFormationExecutionRoleArn: !GetAtt IamStack.Outputs.CloudFormationExecutionRoleArn
        BackupRestoreRoleArn: !GetAtt IamStack.Outputs.BackupRestoreRoleArn
        DrRuntimeTemplateUrl: !Ref DrRuntimeTemplateUrl
        PrimaryRegion: !Ref PrimaryRegion
        PrimaryAlarmName: !Ref PrimaryAlarmName
        DrBackupVaultName: !Ref DrBackupVaultName
        SourceCredentialSecretId: !Ref SourceCredentialSecretName
        SourceDatabaseArn: !Ref SourceDatabaseArn
        DbInstanceClass: !Ref DbInstanceClass
        DatabaseName: !Ref DatabaseName
        ContainerPort: !Ref ContainerPort
        HostedZoneId: !Ref HostedZoneId
        DomainName: !Ref DomainName
        DrCertificateArn: !Ref DrCertificateArn
        RepositoryPrefix: !Ref RepositoryPrefix
        ImageTag: !Ref ImageTag
        ProductionDesiredCount: !Ref ProductionDesiredCount
        WorkflowTimeoutSeconds: !Ref WorkflowTimeoutSeconds

  EventBridgeStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./eventbridge-dr.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        PrimaryRegion: !Ref PrimaryRegion
        PrimaryAlarmName: !Ref PrimaryAlarmName
        StateMachineArn: !GetAtt StepFunctionsStack.Outputs.StateMachineArn
        NotificationTopicArn: !GetAtt SnsStack.Outputs.TopicArn

Outputs:
  StateMachineArn: {Description: DR orchestrator ARN., Value: !GetAtt StepFunctionsStack.Outputs.StateMachineArn}
  NotificationTopicArn: {Description: DR SNS topic ARN., Value: !GetAtt SnsStack.Outputs.TopicArn}
  DrEventBusArn: {Description: Singapore event bus ARN for Sydney forwarder., Value: !GetAtt EventBridgeStack.Outputs.DrEventBusArn}
