AWSTemplateFormatVersion: '2010-09-09'
Description: Encrypted DR notification topic and optional email subscription.

Parameters:
  ProjectName: {Type: String}
  NotificationEmail: {Type: String, Default: ''}

Conditions:
  HasEmail: !Not [!Equals [!Ref NotificationEmail, '']]

Resources:
  NotificationKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub '${ProjectName} DR notification encryption key'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowSnsEncryption
            Effect: Allow
            Principal:
              Service:
                - sns.amazonaws.com
                - events.amazonaws.com
                - states.amazonaws.com
            Action: [kms:Decrypt, 'kms:GenerateDataKey*']
            Resource: '*'
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
                kms:EncryptionContext:aws:sns:topicArn: !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${ProjectName}-notifications'

  NotificationKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${ProjectName}-dr-notifications'
      TargetKeyId: !Ref NotificationKey

  NotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ProjectName}-notifications'
      KmsMasterKeyId: !GetAtt NotificationKey.Arn
      Tags:
        - {Key: Environment, Value: production}
        - {Key: Project, Value: multi-region-dr}
  EmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasEmail
    Properties:
      TopicArn: !Ref NotificationTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  EventBridgePublishPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref NotificationTopic]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAccountEventBridgeFailureNotifications
            Effect: Allow
            Principal: {Service: events.amazonaws.com}
            Action: sns:Publish
            Resource: !Ref NotificationTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

Outputs:
  TopicArn: {Description: Encrypted DR notification topic ARN., Value: !Ref NotificationTopic}
  TopicKeyArn: {Description: Customer-managed key ARN for DR notifications., Value: !GetAtt NotificationKey.Arn}
