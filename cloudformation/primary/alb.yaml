AWSTemplateFormatVersion: '2010-09-09'
Description: Primary internet-facing ALB and path-based target groups.

Parameters:
  ProjectName:
    Type: String
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  AlbSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  ContainerPort:
    Type: Number
    Default: 8080
  CertificateArn:
    Type: String
    Default: ''
  EnableDeletionProtection:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']

Conditions:
  HasCertificate: !Not [!Equals [!Ref CertificateArn, '']]

Resources:
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      SecurityGroups: [!Ref AlbSecurityGroupId]
      Subnets: !Ref PublicSubnetIds
      LoadBalancerAttributes:
        - Key: deletion_protection.enabled
          Value: !Ref EnableDeletionProtection
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-primary-alb'

  AuthTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: !Ref ContainerPort
      Protocol: HTTP
      TargetType: ip
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
      HealthCheckEnabled: true
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: 200-399

  ProductTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: !Ref ContainerPort
      Protocol: HTTP
      TargetType: ip
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
      HealthCheckPath: /health
      Matcher: {HttpCode: 200-399}

  OrderTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: !Ref ContainerPort
      Protocol: HTTP
      TargetType: ip
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
      HealthCheckPath: /health
      Matcher: {HttpCode: 200-399}

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - !If
          - HasCertificate
          - Type: redirect
            RedirectConfig:
              Port: '443'
              Protocol: HTTPS
              StatusCode: HTTP_301
          - Type: fixed-response
            FixedResponseConfig:
              ContentType: application/json
              MessageBody: '{"error":"not found"}'
              StatusCode: '404'

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            ContentType: application/json
            MessageBody: '{"error":"not found"}'
            StatusCode: '404'

  AuthHttpRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !If [HasCertificate, !Ref HttpsListener, !Ref HttpListener]
      Priority: 10
      Conditions:
        - Field: path-pattern
          Values: [/auth, '/auth/*']
      Actions:
        - Type: forward
          TargetGroupArn: !Ref AuthTargetGroup

  ProductHttpRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !If [HasCertificate, !Ref HttpsListener, !Ref HttpListener]
      Priority: 20
      Conditions:
        - Field: path-pattern
          Values: [/product, '/product/*', /products, '/products/*', /health]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref ProductTargetGroup

  OrderHttpRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !If [HasCertificate, !Ref HttpsListener, !Ref HttpListener]
      Priority: 30
      Conditions:
        - Field: path-pattern
          Values: [/order, '/order/*']
      Actions:
        - Type: forward
          TargetGroupArn: !Ref OrderTargetGroup

Outputs:
  LoadBalancerArn:
    Description: Primary ALB ARN.
    Value: !Ref LoadBalancer
  LoadBalancerDnsName:
    Description: Primary ALB DNS name.
    Value: !GetAtt LoadBalancer.DNSName
  LoadBalancerCanonicalHostedZoneId:
    Description: Primary ALB canonical hosted zone ID.
    Value: !GetAtt LoadBalancer.CanonicalHostedZoneID
  LoadBalancerFullName:
    Description: Primary ALB full name for CloudWatch dimensions.
    Value: !GetAtt LoadBalancer.LoadBalancerFullName
  AuthTargetGroupArn:
    Description: Auth target group ARN.
    Value: !Ref AuthTargetGroup
  ProductTargetGroupArn:
    Description: Product target group ARN.
    Value: !Ref ProductTargetGroup
  OrderTargetGroupArn:
    Description: Order target group ARN.
    Value: !Ref OrderTargetGroup
  AuthTargetGroupFullName:
    Description: Auth target group full name for CloudWatch dimensions.
    Value: !GetAtt AuthTargetGroup.TargetGroupFullName
  ProductTargetGroupFullName:
    Description: Product target group full name for CloudWatch dimensions.
    Value: !GetAtt ProductTargetGroup.TargetGroupFullName
  OrderTargetGroupFullName:
    Description: Order target group full name for CloudWatch dimensions.
    Value: !GetAtt OrderTargetGroup.TargetGroupFullName
