AWSTemplateFormatVersion: '2010-09-09'
Description: On-demand DR VPC. Its single NAT lowers lab complexity and exists only during DR.

Parameters:
  ProjectName: {Type: String}
  VpcCidr: {Type: String}
  PublicSubnet1Cidr: {Type: String}
  PublicSubnet2Cidr: {Type: String}
  PrivateAppSubnet1Cidr: {Type: String}
  PrivateAppSubnet2Cidr: {Type: String}
  PrivateDbSubnet1Cidr: {Type: String}
  PrivateDbSubnet2Cidr: {Type: String}

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-dr-vpc'}
        - {Key: Environment, Value: production}
        - {Key: Project, Value: multi-region-dr}
        - {Key: ManagedBy, Value: cloudformation}
        - {Key: RegionRole, Value: disaster-recovery}

  InternetGateway: {Type: AWS::EC2::InternetGateway}
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: {VpcId: !Ref Vpc, InternetGatewayId: !Ref InternetGateway}

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Ref PublicSubnet1Cidr
      MapPublicIpOnLaunch: false
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-dr-public-a'}]
  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Ref PublicSubnet2Cidr
      MapPublicIpOnLaunch: false
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-dr-public-b'}]
  AppSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Ref PrivateAppSubnet1Cidr
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-dr-app-a'}]
  AppSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Ref PrivateAppSubnet2Cidr
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-dr-app-b'}]
  DbSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Ref PrivateDbSubnet1Cidr
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-dr-db-a'}]
  DbSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Ref PrivateDbSubnet2Cidr
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-dr-db-b'}]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref Vpc}
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties: {RouteTableId: !Ref PublicRouteTable, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref InternetGateway}
  PublicAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnet1, RouteTableId: !Ref PublicRouteTable}
  PublicAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnet2, RouteTableId: !Ref PublicRouteTable}

  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties: {Domain: vpc}
  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties: {AllocationId: !GetAtt NatEip.AllocationId, SubnetId: !Ref PublicSubnet1}
  AppRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref Vpc}
  AppRoute:
    Type: AWS::EC2::Route
    Properties: {RouteTableId: !Ref AppRouteTable, DestinationCidrBlock: 0.0.0.0/0, NatGatewayId: !Ref NatGateway}
  AppAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref AppSubnet1, RouteTableId: !Ref AppRouteTable}
  AppAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref AppSubnet2, RouteTableId: !Ref AppRouteTable}

  DbRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref Vpc}
  DbAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref DbSubnet1, RouteTableId: !Ref DbRouteTable}
  DbAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref DbSubnet2, RouteTableId: !Ref DbRouteTable}
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub '${ProjectName} DR restore subnets'
      SubnetIds: [!Ref DbSubnet1, !Ref DbSubnet2]

Outputs:
  VpcId: {Description: DR VPC ID., Value: !Ref Vpc}
  VpcCidr: {Description: DR VPC CIDR., Value: !Ref VpcCidr}
  PublicSubnetIds: {Description: Public subnet IDs., Value: !Join [',', [!Ref PublicSubnet1, !Ref PublicSubnet2]]}
  AppSubnetIds: {Description: Private app subnet IDs., Value: !Join [',', [!Ref AppSubnet1, !Ref AppSubnet2]]}
  DbSubnetGroupName: {Description: DR DB subnet group., Value: !Ref DbSubnetGroup}
