AWSTemplateFormatVersion: '2010-09-09'
Description: On-demand DR ALB and path target groups.

Parameters:
  ProjectName: {Type: String}
  VpcId: {Type: AWS::EC2::VPC::Id}
  PublicSubnetIds: {Type: 'List<AWS::EC2::Subnet::Id>'}
  AlbSecurityGroupId: {Type: AWS::EC2::SecurityGroup::Id}
  CertificateArn: {Type: String, Default: ''}
  ContainerPort: {Type: Number, Default: 8080}

Conditions:
  HasCertificate: !Not [!Equals [!Ref CertificateArn, '']]

Resources:
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      SecurityGroups: [!Ref AlbSecurityGroupId]
      Subnets: !Ref PublicSubnetIds
      LoadBalancerAttributes:
        - {Key: deletion_protection.enabled, Value: 'false'}
        - {Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true'}
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-dr-alb'}]
  AuthTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: !Ref ContainerPort
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /health
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      HealthCheckIntervalSeconds: 30
      TargetGroupAttributes: [{Key: deregistration_delay.timeout_seconds, Value: '30'}]
      Matcher: {HttpCode: 200-399}
  ProductTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties: {VpcId: !Ref VpcId, Port: !Ref ContainerPort, Protocol: HTTP, TargetType: ip, HealthCheckPath: /health, TargetGroupAttributes: [{Key: deregistration_delay.timeout_seconds, Value: '30'}], Matcher: {HttpCode: 200-399}}
  OrderTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties: {VpcId: !Ref VpcId, Port: !Ref ContainerPort, Protocol: HTTP, TargetType: ip, HealthCheckPath: /health, TargetGroupAttributes: [{Key: deregistration_delay.timeout_seconds, Value: '30'}], Matcher: {HttpCode: 200-399}}
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - !If
          - HasCertificate
          - {Type: redirect, RedirectConfig: {Port: '443', Protocol: HTTPS, StatusCode: HTTP_301}}
          - {Type: fixed-response, FixedResponseConfig: {ContentType: application/json, MessageBody: '{"error":"not found"}', StatusCode: '404'}}
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates: [{CertificateArn: !Ref CertificateArn}]
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions: [{Type: fixed-response, FixedResponseConfig: {ContentType: application/json, MessageBody: '{"error":"not found"}', StatusCode: '404'}}]
  AuthRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !If [HasCertificate, !Ref HttpsListener, !Ref HttpListener]
      Priority: 10
      Conditions: [{Field: path-pattern, Values: [/auth, '/auth/*', /health]}]
      Actions: [{Type: forward, TargetGroupArn: !Ref AuthTargetGroup}]
  ProductRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !If [HasCertificate, !Ref HttpsListener, !Ref HttpListener]
      Priority: 20
      Conditions: [{Field: path-pattern, Values: [/product, '/product/*']}]
      Actions: [{Type: forward, TargetGroupArn: !Ref ProductTargetGroup}]
  OrderRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !If [HasCertificate, !Ref HttpsListener, !Ref HttpListener]
      Priority: 30
      Conditions: [{Field: path-pattern, Values: [/order, '/order/*']}]
      Actions: [{Type: forward, TargetGroupArn: !Ref OrderTargetGroup}]

Outputs:
  LoadBalancerArn: {Description: DR ALB ARN., Value: !Ref LoadBalancer}
  LoadBalancerDnsName: {Description: DR ALB DNS name., Value: !GetAtt LoadBalancer.DNSName}
  LoadBalancerCanonicalHostedZoneId: {Description: DR ALB zone ID., Value: !GetAtt LoadBalancer.CanonicalHostedZoneID}
  AuthTargetGroupArn: {Description: DR auth target group., Value: !Ref AuthTargetGroup}
  ProductTargetGroupArn: {Description: DR product target group., Value: !Ref ProductTargetGroup}
  OrderTargetGroupArn: {Description: DR order target group., Value: !Ref OrderTargetGroup}
  LoadBalancerFullName: {Description: DR ALB CloudWatch dimension., Value: !GetAtt LoadBalancer.LoadBalancerFullName}
  AuthTargetGroupFullName: {Description: DR auth target-group dimension., Value: !GetAtt AuthTargetGroup.TargetGroupFullName}
  ProductTargetGroupFullName: {Description: DR product target-group dimension., Value: !GetAtt ProductTargetGroup.TargetGroupFullName}
  OrderTargetGroupFullName: {Description: DR order target-group dimension., Value: !GetAtt OrderTargetGroup.TargetGroupFullName}
